<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex"><title>Admin | NU Student Support Centre</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap">
<style>
:root{--ink:#12263f;--paper:#f7f9fb;--card:#fff;--line:#d9e1ea;--teal:#0e7c7b;--gold:#f2a900;--muted:#546579;--hero:#12263f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}


html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Hind Siliguri","Noto Sans Bengali","Segoe UI",Arial,sans-serif;line-height:1.7;font-size:17px}
a{color:var(--teal)}:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--card);border-bottom:1px solid var(--line);z-index:5}
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 20px;max-width:1040px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-weight:700;line-height:1.1}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.btn{display:inline-block;background:var(--gold);color:#12263f;font-weight:700;padding:10px 18px;border-radius:8px;text-decoration:none;border:0;font:inherit;font-weight:700;cursor:pointer}
.btn.alt{background:transparent;color:inherit;border:2px solid currentColor}.btn.red{background:#b3261e;color:#fff}
.hero{background:var(--hero);color:#fff;padding:52px 0}
.hero p{color:#cdd8e4;max-width:56ch;margin:0 0 22px}
h1{font-size:clamp(27px,5vw,42px);line-height:1.25;margin:0 0 14px}
section{padding:44px 0}h2{font-size:clamp(22px,3.5vw,29px);margin:0 0 8px}.lead{color:var(--muted);margin:0 0 24px;max-width:62ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.svc{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--teal);border-radius:6px;padding:16px 18px;text-decoration:none;color:var(--ink)}
.svc b{display:block;font-size:18px}.svc span{color:var(--muted);font-size:14.5px}.svc:hover{border-left-color:var(--gold)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.steps{counter-reset:s;list-style:none;margin:0;padding:0}
.steps li{counter-increment:s;position:relative;padding:0 0 16px 46px}
.steps li:before{content:counter(s);position:absolute;left:0;top:0;width:32px;height:32px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:16px}
.box h3{margin:0 0 10px;font-size:19px}.box ul{margin:0;padding-left:20px}.fee{font-size:30px;font-weight:700;color:var(--teal);line-height:1.3}
details{background:var(--card);border:1px solid var(--line);border-radius:8px;margin-bottom:10px;padding:0 18px}
summary{cursor:pointer;font-weight:600;padding:14px 0}details p{margin:0 0 14px;color:var(--muted)}
.person{display:flex;gap:16px;align-items:center}.person img{width:84px;height:84px;border-radius:50%;object-fit:cover;background:var(--line);flex:none}
.person b{display:block;font-size:19px}.person span{color:var(--muted);font-size:15px}
label{display:block;font-weight:600;font-size:14.5px;margin:12px 0 4px}
input[type=text],input[type=password],textarea{width:100%;font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink)}
textarea{min-height:90px}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.msg{background:var(--card);border-left:4px solid var(--gold);padding:12px 16px;margin-bottom:16px;border-radius:4px}
footer{background:var(--hero);color:#b9c7d6;padding:28px 0;font-size:14.5px}footer a{color:#fff}
@media(max-width:760px){.two{grid-template-columns:1fr}body{font-size:16.5px}}
.fig{margin:0}.fig img{width:100%;display:block;border:1px solid var(--line);border-radius:6px}.fig figcaption{font-size:14.5px;color:var(--muted);padding-top:6px}.sm{border:1px dashed var(--line);border-radius:8px;padding:10px 14px;margin:10px 0}
.nav{display:flex;gap:4px;overflow-x:auto;padding:0 14px 8px;max-width:1040px;margin:0 auto}.nav a{white-space:nowrap;color:var(--ink);text-decoration:none;font-weight:500;font-size:15px;padding:3px 10px;border-radius:6px}.nav a:hover{background:var(--paper);color:var(--teal)}.cards3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.cards3 .box{margin:0}.fl a{color:#fff;margin-right:16px}.frame{width:100%;height:80vh;border:1px solid var(--line);border-radius:8px;background:#fff}
.note{font-size:13.5px;color:var(--muted)}.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin:12px 0}.swatch{display:flex;flex-wrap:wrap;align-items:center;border:2px solid var(--line);background:var(--card);border-radius:10px;padding:8px;cursor:pointer;font:inherit;color:var(--ink);text-align:left}.swatch.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}.swatch span{width:22px;height:22px;border-radius:50%;margin-right:3px;display:inline-block}.swatch em{flex-basis:100%;font-style:normal;font-size:13.5px;margin-top:6px}.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-top:10px}input[type=color]{width:100%;height:42px;border:1px solid var(--line);border-radius:6px;background:var(--card);padding:2px}select{width:100%;font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink)}
.vid{position:relative;padding-top:56.25%;background:#000;border-radius:10px;overflow:hidden}.vid iframe,.vid video{position:absolute;top:0;left:0;width:100%;height:100%;border:0}
:root{--r:12px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--card) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.logo{height:42px;width:auto;max-width:160px;object-fit:contain}
.dnav{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;flex:1}.dnav a{padding:5px 10px;border-radius:999px;color:var(--ink);text-decoration:none;font-weight:500;font-size:14.5px;white-space:nowrap}.dnav a:hover{background:var(--paper);color:var(--teal)}
.btn.sm{padding:7px 14px;font-size:14px}.burger{display:none;width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:20px;place-items:center;cursor:pointer}
.drawer{position:fixed;inset:0;z-index:40;display:none}.drawer.on{display:block}.drawer .back{position:absolute;inset:0;background:rgba(0,0,0,.5)}.drawer .sheet{position:absolute;right:0;top:0;bottom:0;width:min(86vw,340px);background:var(--card);padding:20px;overflow:auto;box-shadow:-10px 0 40px rgba(0,0,0,.3)}.drawer .sheet a{display:block;padding:13px 6px;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:500}
.hero2{position:relative;overflow:hidden;color:#fff;background:linear-gradient(135deg,var(--hero),color-mix(in srgb,var(--hero) 50%,var(--teal)))}
.hero2:before{content:"";position:absolute;width:560px;height:560px;border-radius:50%;right:-180px;top:-200px;background:radial-gradient(circle,rgba(255,255,255,.16),transparent 65%)}
.hero2:after{content:"";position:absolute;width:420px;height:420px;border-radius:50%;left:-160px;bottom:-220px;background:radial-gradient(circle,color-mix(in srgb,var(--gold) 38%,transparent),transparent 65%)}
.hero2 .in{position:relative;z-index:1;display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center;padding-top:56px;padding-bottom:78px}
.hero2 .in>*{animation:up .7s both}.hero2 .in>*:nth-child(2){animation-delay:.12s}@keyframes up{from{opacity:0;transform:translateY(14px)}}
.pill{display:inline-block;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);padding:3px 14px;border-radius:999px;font-size:14px;margin-bottom:14px}
.hero2 h1{font-size:clamp(28px,6vw,46px);line-height:1.25;margin:0 0 12px}.hero2 p{color:#dbe5ef;margin:0 0 22px;max-width:52ch}
.heroimg{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:calc(var(--r) + 12px);box-shadow:0 24px 60px rgba(0,0,0,.4);border:4px solid rgba(255,255,255,.22)}
.cert{position:relative;width:min(100%,340px);margin:0 auto;aspect-ratio:1.3;background:var(--card);border-radius:calc(var(--r) + 6px);padding:22px;box-shadow:0 24px 60px rgba(0,0,0,.4);transform:rotate(3deg);color:var(--ink)}
.cert i{display:block;height:10px;border-radius:6px;background:var(--line);margin:11px 0}.cert i:nth-child(1){width:55%;height:15px;background:var(--teal)}.cert i:nth-child(2){width:92%}.cert i:nth-child(3){width:78%}
.cert u{position:absolute;right:24px;bottom:22px;width:62px;height:62px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 6px color-mix(in srgb,var(--gold) 35%,transparent)}.cert em{position:absolute;right:24px;bottom:22px;width:62px;height:62px;display:grid;place-items:center;font-style:normal;font-size:28px;color:#12263f}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:12px;margin-top:-40px;position:relative;z-index:2}.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 8px;text-align:center;box-shadow:0 12px 30px rgba(0,0,0,.1)}.stat b{display:block;font-size:clamp(17px,4.5vw,26px);color:var(--teal);line-height:1.3}.stat span{font-size:13.5px;color:var(--muted)}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.svc.scard{display:flex;gap:14px;align-items:center;border:1px solid var(--line);border-left:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:0 6px 18px rgba(0,0,0,.05);transition:transform .2s,box-shadow .2s}.svc.scard:hover{transform:translateY(-3px);box-shadow:0 14px 28px rgba(0,0,0,.12);border-color:var(--teal)}
.ico{width:48px;height:48px;border-radius:14px;background:color-mix(in srgb,var(--teal) 14%,transparent);display:grid;place-items:center;font-size:25px;flex:none}.ico.big{width:60px;height:60px;font-size:32px;margin-bottom:10px}
.scard b{color:var(--ink);font-size:17px;line-height:1.3}.scard em{display:block;font-style:normal;color:var(--muted);font-size:14px;line-height:1.5}
section.alt{background:var(--card);border-block:1px solid var(--line)}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;counter-reset:h;margin-top:18px}.how>div{position:relative;padding:44px 18px 18px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r)}.how>div:before{counter-increment:h;content:counter(h);position:absolute;left:18px;top:-16px;width:36px;height:36px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font-weight:700;box-shadow:0 0 0 5px var(--card)}
.fcard{display:grid;grid-template-columns:190px 1fr;gap:26px;align-items:center;background:linear-gradient(135deg,var(--card),color-mix(in srgb,var(--teal) 9%,var(--card)));border:1px solid var(--line);border-radius:calc(var(--r) + 8px);padding:28px}.fcard img{width:190px;height:190px;border-radius:50%;object-fit:cover;border:5px solid var(--gold);box-shadow:0 12px 30px rgba(0,0,0,.18)}
.fcard blockquote{margin:8px 0 14px;font-size:clamp(16.5px,2.6vw,19.5px);line-height:1.85}.pill2{display:inline-block;background:color-mix(in srgb,var(--gold) 28%,transparent);padding:2px 12px;border-radius:999px;font-size:13.5px;font-weight:600}
.scover{display:block;width:100%;max-height:300px;object-fit:cover;border-radius:calc(var(--r) + 6px);margin-bottom:16px}
.bottombar{display:none}
@media(max-width:760px){.dnav,.hide-s{display:none}.burger{display:grid}.hero2 .in{grid-template-columns:1fr;padding-top:30px;padding-bottom:70px;gap:22px}.bar{padding:8px 14px;gap:8px}.bar .row{flex-wrap:nowrap;align-items:center}.brand{min-width:0;flex:1;font-size:15px}.brand small{display:none}.logo{height:36px}.cert{width:min(78%,300px)}.fcard{grid-template-columns:1fr;text-align:center;justify-items:center;padding:22px}.sgrid{grid-template-columns:1fr 1fr;gap:10px}.svc.scard{flex-direction:column;align-items:flex-start;padding:14px;gap:10px}.scard b{font-size:16px}.scard em{font-size:13px}.bottombar{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:8px;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 20px rgba(0,0,0,.08)}.bottombar a{display:flex;align-items:center;justify-content:center;padding:10px 6px;border-radius:12px;text-decoration:none;font-weight:600;font-size:14.5px}.bottombar a:not(.btn){color:var(--ink);background:var(--paper);border:1px solid var(--line)}body{padding-bottom:calc(74px + env(safe-area-inset-bottom,0px))}.stats{margin-top:-46px}}
@media(prefers-reduced-motion:reduce){.hero2 .in>*{animation:none}.svc.scard{transition:none}}

function collect(){document.querySelectorAll('[data-show]').forEach(function(i){S.site['show'+i.dataset.show]=i.checked});document.querySelectorAll('[data-st]').forEach(function(i){S.site.stats[i.dataset.st][i.dataset.k]=i.value});document.querySelectorAll('[data-sp]').forEach(function(i){S.site.steps[i.dataset.sp][i.dataset.k]=i.value});document.querySelectorAll('[data-th]').forEach(function(i){var k=i.dataset.th;S.site.theme[k]=k==='radius'?+i.value:i.value});document.querySelectorAll('[data-cp]').forEach(function(i){var c=S.customPages[i.dataset.cp],k=i.dataset.k;c[k]=k==='menu'?i.checked:i.value});document.querySelectorAll('[data-op]').forEach(function(i){S.site.operators[i.dataset.op][i.dataset.k]=i.value});document.querySelectorAll('[data-page]').forEach(function(i){S.pages[i.dataset.page].body=i.value});document.querySelectorAll('[data-site]').forEach(function(i){S.site[i.dataset.site]=i.value});document.querySelectorAll('[data-sv]').forEach(function(i){var s=S.services[i.dataset.sv],k=i.dataset.k,x=i.value;if(i.dataset.sm!==undefined){s.samples[i.dataset.sm][k]=x;return}if(k==='steps'||k==='docs')s[k]=lines(x);else if(k==='faqs')s[k]=lines(x).map(function(l){var p=l.split('|');return{q:p[0].trim(),a:p.slice(1).join('|').trim()}});else s[k]=x})}

function rd(f){return new Promise(function(ok,no){var r=new FileReader();r.onload=function(){ok(r.result)};r.onerror=no;r.readAsDataURL(f)})}
async function shrink(f,max){var u=await rd(f);return new Promise(function(ok,no){var im=new Image();im.onload=function(){var c=document.createElement('canvas'),s=Math.min(1,max/Math.max(im.width,im.height));c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.85).split(',')[1])};im.onerror=no;im.src=u})}
async function gh(path,body){var c=cfg();if(!c.repo||!c.token)throw new Error('আগে GitHub সংযোগ সেভ করুন');var url='https://api.github.com/repos/'+c.repo+'/contents/'+path,h={Authorization:'Bearer '+c.token,Accept:'application/vnd.github+json'};
var sha;try{var g=await fetch(url+'?ref='+(c.branch||'main'),{headers:h});if(g.ok)sha=(await g.json()).sha}catch(e){}
var r=await fetch(url,{method:'PUT',headers:h,body:JSON.stringify({message:'Update '+path,content:body,branch:c.branch||'main',sha:sha})});if(!r.ok)throw new Error('GitHub '+r.status+': টোকেন বা রিপোজিটরি যাচাই করুন');}
async function put(p,b64,mime){if(HOST){var r=await fetch('api.php?a=upload',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF':CSRF},body:JSON.stringify({b64:b64,mime:mime})});var j=await r.json();if(!j.ok)throw new Error(j.err||'আপলোড হয়নি');return j.path}var c=cfg();if(c.repo&&c.token){await gh(p,b64);return p}if(mime==='application/pdf')throw new Error('PDF আপলোডের জন্য আগে GitHub সংযোগ সেভ করুন');return 'data:'+mime+';base64,'+b64}
function dlf(n,c,t){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:t}));a.download=n;a.click()}

return '<div class="box"><h3>ডিজাইন ও রং</h3><p class="note">পছন্দের থিম বেছে নিন, তারপর চাইলে নিচে নিজের রং বদলান। এই পেজেই সাথে সাথে দেখতে পাবেন। সাইটে আনতে "GitHub এ সেভ করুন" চাপুন।</p><div class="swatches">'+sw+'</div><div class="cgrid">'+cl+'</div><div class="cgrid"><div><label>ফন্ট</label>'+sel('font',FONTS.map(function(f){return[f[0],f[0]]}))+'</div><div><label>ডার্ক মোড</label>'+sel('dark',[['auto','ফোনের সেটিং অনুযায়ী'],['light','সবসময় হালকা'],['dark','সবসময় গাঢ়']])+'</div><div><label>কোণের ধরন</label>'+sel('radius',[[0,'চৌকো'],[6,'হালকা গোল'],[10,'গোল'],[18,'খুব গোল']])+'</div><div><label>হিরো ব্যাকগ্রাউন্ড</label>'+sel('heroStyle',[['solid','এক রং'],['gradient','গ্রেডিয়েন্ট']])+'</div></div></div>'}

function detect(cb){fetch('api.php?a=me',{credentials:'same-origin'}).then(function(r){return r.ok?r.json():Promise.reject()}).then(function(j){if(j&&j.host===true){HOST=true;OK=!!j.auth;CSRF=j.csrf||''}cb()}).catch(function(){cb()})}

async function upVid(inp,i){var f=inp.files[0];if(!f)return;collect();try{var fd=new FormData();fd.append('file',f);var r=await fetch('api.php?a=upload',{method:'POST',headers:{'X-CSRF':CSRF},body:fd});var j=await r.json();if(!j.ok)throw new Error(j.err||'আপলোড হয়নি');S.services[i].video=j.path;MSG='ভিডিও আপলোড হয়েছে। এবার "সেভ" চাপুন।'}catch(e){MSG='ভিডিও আপলোড হয়নি: '+e.message}render()}
async function pbk(u,p,salt){var k=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveBits']);var b=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:new TextEncoder().encode(salt+u),iterations:200000},k,256);return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('')}

async function doLogin(){var u=document.getElementById('lu').value.trim(),p=document.getElementById('lp').value;if(HOST){try{var r=await fetch('api.php?a=login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({u:u,p:p})});var j=await r.json();if(j.ok){OK=true;CSRF=j.csrf;MSG=''}else MSG=j.err||'ইউজারনেম বা পাসওয়ার্ড ভুল।'}catch(e){MSG='সার্ভারে সমস্যা হয়েছে।'}render();return}try{var h=await pbk(u,p,S.admin.salt);if(u===S.admin.user&&h===S.admin.hash){OK=true;MSG=''}else MSG='ইউজারনেম বা পাসওয়ার্ড ভুল।'}catch(e){MSG='লগইন করা যায়নি। HTTPS লিংক থেকে খুলুন।'}render()}
async function setCreds(){var u=document.getElementById('nu').value.trim(),p=document.getElementById('np').value;if(!u||p.length<10){MSG='ইউজারনেম দিন এবং পাসওয়ার্ড কমপক্ষে ১০ অক্ষরের দিন।';render();return}if(HOST){try{var r=await fetch('api.php?a=passwd',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF':CSRF},body:JSON.stringify({u:u,p:p})});var j=await r.json();MSG=j.ok?'নতুন লগইন তথ্য চালু হয়েছে।':(j.err||'হয়নি')}catch(e){MSG='সার্ভারে সমস্যা হয়েছে।'}render();return}collect();var b=new Uint8Array(12);crypto.getRandomValues(b);var salt=Array.from(b).map(function(x){return x.toString(16).padStart(2,'0')}).join('');S.admin={user:u,salt:salt,hash:await pbk(u,p,salt)};MSG='নতুন লগইন তথ্য তৈরি হয়েছে। চালু করতে "GitHub এ সেভ করুন" চাপুন।';render()}
